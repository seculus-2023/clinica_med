{% if is_paginated %}
<nav class="mt-3 d-flex justify-content-between align-items-center flex-wrap gap-2" aria-label="Paginação">
  <small class="text-muted">{{ page_obj.paginator.count }} registro(s) &middot; página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</small>
  <ul class="pagination pagination-sm mb-0">
    {% if page_obj.has_previous %}<li class="page-item"><a class="page-link" href="?{{ params }}&page={{ page_obj.previous_page_number }}">Anterior</a></li>{% endif %}
    {% if page_obj.has_next %}<li class="page-item"><a class="page-link" href="?{{ params }}&page={{ page_obj.next_page_number }}">Próxima</a></li>{% endif %}
  </ul>
</nav>
{% endif %}
