<div class="dropdown">
  <button class="am-icone" data-bs-toggle="dropdown" aria-label="Menu"><i class="bi bi-three-dots-vertical"></i></button>
  <ul class="dropdown-menu dropdown-menu-end">
    <li><button type="button" class="dropdown-item d-none" data-instalar hidden><i class="bi bi-download me-2"></i>Instalar aplicativo</button></li>
    {% if opcao_cancelados %}<li><a class="dropdown-item" href="?data={{ data|date:'Y-m-d' }}&cancelados={% if mostrar_cancelados %}0{% else %}1{% endif %}"><i class="bi bi-eye{% if mostrar_cancelados %}-slash{% endif %} me-2"></i>{% if mostrar_cancelados %}Ocultar{% else %}Mostrar{% endif %} cancelados</a></li>{% endif %}
    {% if varias_clinicas %}<li><a class="dropdown-item" href="{% url 'areamedica:clinica' %}"><i class="bi bi-building me-2"></i>Trocar de clínica</a></li>{% endif %}
    <li><a class="dropdown-item" href="{% url 'painel:dashboard' %}"><i class="bi bi-grid me-2"></i>Sistema completo</a></li>
    <li><hr class="dropdown-divider"></li>
    <li><form method="post" action="{% url 'areamedica:sair' %}">{% csrf_token %}
      <button class="dropdown-item text-danger"><i class="bi bi-box-arrow-right me-2"></i>Sair</button></form></li>
  </ul>
</div>
