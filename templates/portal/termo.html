{% extends "portal/base.html" %}
{% block titulo %}Termo de uso dos dados{% endblock %}
{% block conteudo %}
<div class="card"><div class="card-body p-4">
  <h1 class="h5 fw-bold"><i class="bi bi-shield-check text-primary"></i> Uso dos seus dados</h1>
  <p class="small">{{ texto }}</p>
  <form method="post" novalidate>{% csrf_token %}
    <div class="row">{% include "_campo.html" with f=form.aceito col="col-12 mb-3" %}</div>
    <button class="btn btn-primary w-100">Continuar</button>
  </form>
</div></div>
{% endblock %}
