<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Senha {{ s.codigo }}</title>
<style>
  @page { size: 80mm auto; margin: 3mm; }
  body { font-family: Arial, Helvetica, sans-serif; width: 72mm; margin: 0 auto; text-align: center; color: #000; background: #fff; }
  h1 { font-size: 14pt; margin: 6px 0 2px; }
  .codigo { font-size: 46pt; font-weight: 700; margin: 8px 0; }
  .tipo { font-size: 12pt; font-weight: 700; }
  p { font-size: 10pt; margin: 4px 0; }
</style>
</head>
<body onload="window.print()">
  <h1>{{ clinica.nome }}</h1>
  <p>{{ s.servico.nome }}</p>
  <div class="codigo">{{ s.codigo }}</div>
  {% if s.preferencial %}<div class="tipo">PREFERENCIAL</div>{% endif %}
  <p>{{ s.criado_em|date:"d/m/Y H:i" }}</p>
  <p>Aguarde a chamada no painel.</p>
</body>
</html>
